[package]
name = "jaq_py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for jaq, a jq clone written in Rust"
license = "MIT"
repository = "https://github.com/filipsnastins/jaq-py"

[lib]
crate-type = ["cdylib"]

[dependencies]
jaq-core = "2.2"
jaq-json = { version = "2.0", features = ["serde_json"] }
jaq-std = "2.1"
pyo3 = { version = "0.27.2", features = ["extension-module"] }
pythonize = "0.27"
serde_json = "1.0"
